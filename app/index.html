<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HACF Self-Check — Human–AI Capability Framework</title>
<meta name="description" content="Free 15-minute self-check of your capability to work with AI: five dimensions, provisional HACF level, risk flags. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --surface:#FFFFFF; --ink:#18212C; --muted:#5A6573; --line:#D5DBE2;
  --teal:#0E5E6F; --teal-soft:#DCEBEE; --risk:#B4232C; --risk-soft:#F6DEDF; --ok:#2E7A4E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#11171D; --surface:#1A222B; --ink:#E7ECF1; --muted:#9AA6B3; --line:#2E3A46;
    --teal:#5FB7C7; --teal-soft:#16343B; --risk:#EF7C83; --risk-soft:#3A1E21; --ok:#6CC28F; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
.wrap{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem}
header.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:2.5rem}
.brand{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:1rem;color:var(--muted)}
.brand a{color:inherit}
.lang{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;padding:.3rem .7rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem);margin-bottom:1rem;max-width:18ch}
.hero p{color:var(--muted);max-width:60ch;margin:0 0 1rem}
.privacy{font-size:.92rem;border-left:3px solid var(--teal);padding:.2rem 0 .2rem .9rem;color:var(--muted)}
.btn{display:inline-block;border:0;border-radius:6px;background:var(--teal);color:#fff;font:600 1rem "IBM Plex Sans",sans-serif;padding:.8rem 1.4rem;cursor:pointer;text-decoration:none}
@media (prefers-color-scheme: dark){.btn{color:#0B1A1E}}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.lang button:focus-visible,input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:.75rem 0;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.progress .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress .fill{height:100%;background:var(--teal);width:0;transition:width .2s}
.progress .meta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-top:.35rem}
section.part{margin:2.5rem 0}
section.part>h2{font-size:1.6rem;margin-bottom:.4rem}
section.part>p.lead{color:var(--muted);margin:0 0 1.5rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem;margin-bottom:.9rem}
.q legend{font-weight:500;padding:0;margin-bottom:.8rem;float:left;width:100%}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q .num{color:var(--muted);font-weight:400;margin-right:.35rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;clear:both}
.scale label,.opts label{position:relative;cursor:pointer}
.scale input,.opts input{position:absolute;opacity:0;width:1px;height:1px}
.scale span{display:block;text-align:center;border:1px solid var(--line);border-radius:6px;padding:.45rem .2rem;font-size:.85rem;line-height:1.25}
.scale span b{display:block;font-size:1.05rem}
.opts{display:grid;gap:.45rem;clear:both}
.opts span{display:block;border:1px solid var(--line);border-radius:6px;padding:.55rem .8rem;font-size:.95rem}
.scale input:checked+span,.opts input:checked+span{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.5rem}
.hint{font-size:.9rem;color:var(--muted)}
/* result */
#result{display:none}
#result.show{display:block}
.notation{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:clamp(1.6rem,6.5vw,2.6rem);line-height:1.1;letter-spacing:-.01em;margin:.5rem 0 .3rem;word-break:break-word}
.notation .lvl{color:var(--teal)}
.sub{color:var(--muted);margin:0 0 2rem}
.gates{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.2rem .6rem}
.gates h3{font-size:1.15rem;margin-bottom:1rem}
.dim{display:grid;grid-template-columns:8.5rem 1fr 2rem;align-items:center;gap:.8rem;margin-bottom:.9rem}
.dim .name{font-size:.95rem}
.dim .name small{display:block;color:var(--muted);font-size:.78rem}
.track{position:relative;height:14px;background:var(--line);border-radius:7px}
.track .val{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--teal)}
.track .gate{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.dim .score{font-weight:600;text-align:right}
.legend{font-size:.82rem;color:var(--muted);margin:.4rem 0 .6rem}
.flags{margin:1.5rem 0;display:grid;gap:.7rem}
.flag{border-radius:8px;padding:.9rem 1rem;border:1px solid var(--line);background:var(--surface)}
.flag.risk{border-color:var(--risk);background:var(--risk-soft)}
.flag strong{display:block;margin-bottom:.15rem}
.next{margin-top:2rem}
.next h3{font-size:1.25rem;margin-bottom:.6rem}
.next ol{padding-left:1.2rem;margin:0}
.next li{margin-bottom:.5rem}
footer{margin-top:4rem;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1.2rem}
footer a,.wrap a{color:var(--teal)}
@media (max-width:520px){.scale span{font-size:.72rem}.dim{grid-template-columns:6.5rem 1fr 1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><a href="https://github.com/ruslan-omarov/hacf">HACF</a> <span data-t="brandSub"></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <div id="intro" class="hero">
    <h1 data-t="h1"></h1>
    <p data-t="introP"></p>
    <p class="privacy" data-t="privacy"></p>
    <div class="actions"><button class="btn" id="start" type="button" data-t="start"></button></div>
  </div>

  <form id="form" hidden>
    <div class="progress" aria-hidden="true"><div class="bar"><div class="fill" id="fill"></div></div>
      <div class="meta"><span id="count"></span><span data-t="minutes"></span></div></div>
    <section class="part"><h2 data-t="partA"></h2><p class="lead" data-t="partALead"></p><div id="selfQs"></div></section>
    <section class="part"><h2 data-t="partB"></h2><p class="lead" data-t="partBLead"></p><div id="scenQs"></div></section>
    <div class="actions"><button class="btn" type="submit" data-t="see"></button><span class="hint" id="missing" role="status"></span></div>
  </form>

  <section id="result" aria-live="polite">
    <p class="sub" style="margin:0" data-t="yourProfile"></p>
    <div class="notation" id="notation"></div>
    <p class="sub" id="levelLine"></p>
    <div class="gates">
      <h3 data-t="gatesH"></h3>
      <div id="dims"></div>
      <p class="legend" data-t="legend"></p>
    </div>
    <div class="flags" id="flags"></div>
    <div class="next"><h3 data-t="nextH"></h3><ol id="next"></ol></div>
    <div class="actions">
      <button class="btn" type="button" id="dl" data-t="download"></button>
      <button class="btn secondary" type="button" id="again" data-t="again"></button>
    </div>
    <p class="hint" data-t="dlHint"></p>
  </section>

  <footer><p data-t="footer"></p></footer>
</div>

/* Scoring = assessment/scoring-rules.md and assessment/hacf-spec.json v0.1.0 */
const KEY={B1:["b",["K"]],B2:["c",["K"]],B3:["b",["K"]],B4:["c",["J"]],B5:["c",["J"]],B6:["c",["J"]],B7:["b",["J"]],B8:["b",["R"]],B9:["b",["R"]],B10:["b",["R"]],B11:["b",["R"]],B12:["b",["J","R"]],B13:["b",["K","J"]],B14:["c",["R"]],B15:["b",["J"]]};
const SELF_DIM=["K","K","K","A","A","A","C","C","C","J","J","J","R","R","R"];
const DIMS=["K","A","C","J","R"];
const GATES=[{},{K:1,J:1,R:1},{K:2,A:2,J:2,R:2},{K:2,A:3,C:2,J:3,R:3},{K:3,A:3,C:4,J:3,R:3},{K:3,A:3,C:2,J:4,R:4}];
const CAP_SELFCHECK=2; // E1/E2 evidence caps the level at L2

let lang=(navigator.language||"en").toLowerCase().startsWith("ru")?"ru":"en";
let last=null;
const $=s=>document.querySelector(s);

function selfScore(m){return m<=0.5?0:m<1.5?1:m<2.5?2:m<3.3?3:4}
function score(ans){
  const s={},ev={};
  DIMS.forEach(d=>{const v=SELF_DIM.map((dd,i)=>dd===d?ans["A"+(i+1)]:null).filter(x=>x!=null);
    s[d]=selfScore(v.reduce((a,b)=>a+b,0)/v.length);ev[d]=1});
  const t={};DIMS.forEach(d=>t[d]=[0,0]);
  Object.entries(KEY).forEach(([k,[a,ds]])=>ds.forEach(d=>{t[d][1]++;if(ans[k]===a)t[d][0]++}));
  DIMS.forEach(d=>{const[r,n]=t[d];if(n>=3){const sh=r/n;s[d]=sh<.4?1:sh<.7?2:3;ev[d]=2}});
  let level=0;
  for(let l=CAP_SELFCHECK;l>=1;l--){if(Object.entries(GATES[l]).every(([d,v])=>s[d]>=v)){level=l;break}}
  const flags=[];
  if(s.A-s.J>=2)flags.push("RISK-J");
  if(Math.max(s.A,s.C)-s.R>=2)flags.push("RISK-R");
  if(s.K-s.A>=2)flags.push("UNTAPPED");
  const nextGate=GATES[Math.min(level+1,5)];
  const gaps=Object.entries(nextGate).filter(([d,v])=>s[d]<v);
  if(gaps.length===1)flags.push("CEILING");
  flags.push("PROVISIONAL");
  return {s,ev,level,flags,nextGate,gaps};
}

function render(){
  const L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(typeof v==="string")el.innerHTML=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const keep={};new FormData($("#form")).forEach((v,k)=>keep[k]=v);
  $("#selfQs").innerHTML=L.self.map((q,i)=>`<div class="q"><fieldset><legend><span class="num">A${i+1}</span>${q}</legend><div class="scale">${
    L.scale.map((lab,v)=>`<label><input type="radio" name="A${i+1}" value="${v}"${keep["A"+(i+1)]==v?" checked":""}><span><b>${v}</b>${lab}</span></label>`).join("")}</div></fieldset></div>`).join("");
  $("#scenQs").innerHTML=L.scen.map(([q,opts],i)=>`<div class="q"><fieldset><legend><span class="num">B${i+1}</span>${q}</legend><div class="opts">${
    opts.map((o,j)=>{const v="abcd"[j];return `<label><input type="radio" name="B${i+1}" value="${v}"${keep["B"+(i+1)]===v?" checked":""}><span>${o}</span></label>`}).join("")}</div></fieldset></div>`).join("");
  progress();
  if(last)showResult(last);
}
function answers(){const a={};new FormData($("#form")).forEach((v,k)=>a[k]=k[0]==="A"?Number(v):v);return a}
function progress(){const n=Object.keys(answers()).length;$("#fill").style.width=(n/30*100)+"%";$("#count").textContent=T[lang].answered(n,30)}
function showResult(r){
  const L=T[lang];last=r;
  $("#notation").innerHTML=`HACF <span class="lvl">L${r.level}</span> [${DIMS.map(d=>d+r.s[d]).join(" · ")}]`;
  $("#levelLine").textContent=L.level(r.level,L.names[r.level]);
  $("#dims").innerHTML=DIMS.map(d=>{const g=r.nextGate[d];return `<div class="dim"><div class="name">${L.dims[d][0]}<small>${L.dims[d][1]} · ${L.src[r.ev[d]]}</small></div>
    <div class="track" role="img" aria-label="${L.dims[d][0]} ${r.s[d]}/5${g!=null?", ≥"+g:""}"><div class="val" style="width:${r.s[d]*20}%"></div>${g!=null?`<div class="gate" style="left:calc(${g*20}% - 1px)"></div>`:""}</div>
    <div class="score">${r.s[d]}</div></div>`}).join("");
  $("#flags").innerHTML=r.flags.map(f=>`<div class="flag${f.startsWith("RISK")?" risk":""}"><strong>${L.flagT[f][0]}</strong>${L.flagT[f][1]}</div>`).join("");
  const steps=[];
  if(r.flags.includes("RISK-J")||r.flags.includes("RISK-R"))steps.push(L.riskStep);
  r.gaps.forEach(([d,v])=>steps.push(L.needs(L.dims[d][0],v)));
  if(r.level>=2&&!r.gaps.length)steps.push(L.atTop);
  steps.push(L.toL3);
  $("#next").innerHTML=steps.map(s=>`<li>${s}</li>`).join("");
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));
$("#start").addEventListener("click",()=>{$("#intro").hidden=true;$("#form").hidden=false;$("#form").querySelector("input").focus()});
$("#form").addEventListener("change",progress);
$("#form").addEventListener("submit",e=>{e.preventDefault();const a=answers();const miss=30-Object.keys(a).length;
  if(miss){$("#missing").textContent=T[lang].missing(miss);const first=[...Array(15)].map((_,i)=>"A"+(i+1)).concat([...Array(15)].map((_,i)=>"B"+(i+1))).find(k=>!(k in a));
    document.querySelector(`input[name="${first}"]`).closest(".q").scrollIntoView({behavior:"smooth",block:"center"});return}
  $("#missing").textContent="";const r=score(a);r.raw=a;$("#form").hidden=true;$("#result").classList.add("show");showResult(r);window.scrollTo({top:0});$("#notation").focus?.()});
$("#again").addEventListener("click",()=>{last=null;$("#result").classList.remove("show");$("#form").reset();$("#form").hidden=false;progress();window.scrollTo({top:0})});
$("#dl").addEventListener("click",()=>{const a=last.raw;const out=[{id:"self-check",department:"",role:"",scope:"Self",
  self:Object.fromEntries(Object.entries(a).filter(([k])=>k[0]==="A")),scenario:Object.fromEntries(Object.entries(a).filter(([k])=>k[0]==="B")),
  hacf_selfcheck:{version:"0.1.0",date:new Date().toISOString().slice(0,10),profile:last.s,level:last.level,flags:last.flags}}];
  const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
  const l=Object.assign(document.createElement("a"),{href:url,download:"hacf-self-check.json"});document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(url)});
render();
</script>
