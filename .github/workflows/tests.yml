name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: End-to-end sample run
        run: |
          python tools/hacf_assess.py tools/sample/raw_results.json --out /tmp/people.csv
          python tools/hacf_score.py /tmp/people.csv --roles tools/sample/role_profiles.json --out /tmp/report.md
          python tools/hacf_score.py tools/sample/people.csv --roles tools/sample/role_profiles.json --out /tmp/report2.md
